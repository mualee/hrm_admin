<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ລະບົບບໍລິຫານບຸກຄະລາກອນ SSMI HRM — Web Admin</title>
<link rel="icon" type="image/svg+xml" href="itIco.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A2647;
    --navy-2:#0F3163;
    --navy-3:#1B4B8F;
    --gold:#D9A94E;
    --gold-dark:#B8863A;
    --ink:#12233F;
    --muted:#5B6B82;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --border:#E3E8F0;
    --benefit-bg:#FBF3E1;
    --benefit-border:#EED9AE;

    --title-size:30px;
    --h2-size:26px;
    --tagline-size:18px;
    --body-size:17px;
    --small-size:13px;
    --eyebrow-size:13px;
  }
  @media (min-width:800px){
    :root{
      --title-size:44px;
      --h2-size:34px;
      --tagline-size:23px;
      --body-size:22px;
      --small-size:15px;
      --eyebrow-size:15px;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Lao','Phetsarath OT',sans-serif;
    background:#1a1a1a;
    color:var(--ink);
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,p,ul{margin:0;}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em;}

  /* ---------- Slide shell ---------- */
  #slides{position:relative;width:100vw;height:100vh;background:var(--bg);}
  .slide{
    display:none;
    position:absolute;inset:0;
    width:100vw;height:100vh;
    background:var(--card);
    flex-direction:column;
  }
  .slide.active{display:flex;}
  .slide-inner{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding:clamp(20px,4vw,56px) clamp(24px,7vw,110px) clamp(10px,2vw,20px);
    display:flex;
    flex-direction:column;
    gap:clamp(10px,1.6vw,20px);
  }
  .slide-footer{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px clamp(24px,7vw,110px) 14px;
    font-size:var(--small-size);
    color:var(--muted);
    border-top:1px solid var(--border);
  }
  .slide-footer b{color:var(--navy-3);}

  .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-size:var(--eyebrow-size);
    font-weight:700;
    letter-spacing:.06em;
    color:var(--gold-dark);
    text-transform:uppercase;
  }
  .eyebrow .icon{width:1.1em;height:1.1em;}

  /* ---------- Module slide ---------- */
  .module-head{display:flex;align-items:center;gap:18px;}
  .module-icon{
    flex:0 0 auto;
    width:clamp(48px,5vw,72px);height:clamp(48px,5vw,72px);
    border-radius:16px;
    background:linear-gradient(135deg,var(--navy),var(--navy-3));
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .module-icon .icon{width:52%;height:52%;stroke-width:1.6;}
  .module-title{font-size:var(--title-size);font-weight:800;color:var(--navy);line-height:1.2;}
  .tagline{font-size:var(--tagline-size);color:var(--muted);font-weight:500;line-height:1.4;}
  .section-label{
    font-size:var(--small-size);font-weight:700;letter-spacing:.04em;
    color:var(--navy-3);text-transform:uppercase;
    border-bottom:2px solid var(--border);
    padding-bottom:6px;margin-top:4px;
  }
  .feature-list{list-style:none;padding:0;display:grid;gap:10px;}
  .feature-list li{
    position:relative;padding-left:1.7em;
    font-size:var(--body-size);line-height:1.45;color:var(--ink);
  }
  .feature-list li::before{
    content:'';position:absolute;left:0;top:.5em;
    width:9px;height:9px;background:var(--gold);border-radius:3px;
  }
  .benefit-box{
    margin-top:auto;
    background:var(--benefit-bg);
    border:1px solid var(--benefit-border);
    border-left:6px solid var(--gold);
    border-radius:10px;
    padding:clamp(12px,1.6vw,20px) clamp(16px,2vw,24px);
  }
  .benefit-label{
    font-size:var(--small-size);font-weight:800;color:var(--gold-dark);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
  }
  .benefit-text{font-size:var(--body-size);font-weight:600;color:var(--navy);line-height:1.45;}
  .benefit-text ul{list-style:none;padding:0;display:grid;gap:6px;}
  .benefit-text li{position:relative;padding-left:1.4em;}
  .benefit-text li::before{content:'✓';position:absolute;left:0;top:0;color:var(--gold-dark);font-weight:800;}

  /* ---------- Cover ---------- */
  .cover{
    background:radial-gradient(circle at 15% 15%,var(--navy-3),var(--navy) 60%);
    color:#fff;align-items:flex-start;justify-content:center;
  }
  .cover .slide-inner{justify-content:center;gap:22px;}
  .cover-tag{
    display:inline-flex;align-items:center;gap:10px;
    font-size:var(--small-size);font-weight:700;letter-spacing:.12em;
    color:var(--gold);text-transform:uppercase;
    border:1px solid rgba(217,169,78,.5);
    padding:6px 14px;border-radius:999px;width:max-content;
  }
  .cover h1{
    font-size:clamp(32px,5.2vw,64px);
    font-weight:800;line-height:1.18;color:#fff;
    max-width:16ch;
  }
  .cover h1 span{color:var(--gold);}
  .cover .cover-sub{font-size:var(--tagline-size);color:#CBD8ED;max-width:42ch;}
  .cover .cover-company{
    margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);
    font-size:var(--body-size);color:#fff;font-weight:600;max-width:46ch;line-height:1.5;
  }
  .cover .cover-date{font-size:var(--small-size);color:#9FB4D6;margin-top:6px;}

  /* ---------- Overview ---------- */
  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:4px;}
  @media (max-width:760px){.overview-grid{grid-template-columns:1fr;}}
  .overview-card{
    border:1px solid var(--border);border-radius:14px;
    padding:clamp(16px,2vw,26px);
    background:#fff;
  }
  .overview-card.focus{border:2px solid var(--gold);background:var(--benefit-bg);}
  .overview-card .oc-icon{
    width:52px;height:52px;border-radius:12px;
    background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  }
  .overview-card .oc-icon .icon{width:55%;height:55%;}
  .overview-card h3{font-size:calc(var(--tagline-size) + 2px);color:var(--navy);font-weight:800;margin-bottom:8px;}
  .overview-card p{font-size:var(--body-size);color:var(--ink);line-height:1.5;}
  .overview-note{
    margin-top:auto;font-size:var(--body-size);font-weight:700;color:var(--navy);
    background:var(--bg);border-left:5px solid var(--navy-3);
    border-radius:8px;padding:12px 16px;
  }

  /* ---------- TOC ---------- */
  .toc-grid{display:grid;grid-template-columns:repeat(5,1fr);align-items:start;gap:14px;flex:1;min-height:0;}
  @media (max-width:1000px){.toc-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){
    .toc-grid{
      display:flex;
      flex-direction:column;
      align-items:stretch;
      overflow-y:auto;
    }
    .toc-card{flex:0 0 auto;}
  }
  .toc-card{
    border:1px solid var(--border);border-radius:12px;
    padding:8px 14px;display:flex;flex-direction:column;gap:8px;
    background:#fff;min-height:0;
  }
  .toc-card-head{display:flex;align-items:center;gap:8px;}
  .toc-letter{
    width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;
  }
  .toc-card-head .toc-name{font-weight:800;color:var(--navy);font-size:calc(var(--small-size) + 2px);}
  .toc-count{font-size:11px;color:var(--muted);font-weight:600;}
  .toc-list{list-style:none;padding:0;display:grid;gap:5px;overflow-y:auto;}
  .toc-list li a{
    display:block;font-size:var(--small-size);color:var(--ink);text-decoration:none;
    padding:4px 6px;border-radius:6px;line-height:1.35;
    cursor:pointer;
  }
  .toc-list li a:hover{background:var(--benefit-bg);color:var(--navy);}

  /* ---------- List slides (security / automation) ---------- */
  .list-slide-icon{
    width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .list-slide-icon .icon{width:55%;height:55%;}
  .big-list{list-style:none;padding:0;display:grid;gap:12px;margin-top:6px;}
  .big-list li{
    position:relative;padding:10px 14px 10px 42px;
    font-size:var(--body-size);line-height:1.4;color:var(--ink);
    background:var(--bg);border-radius:10px;
  }
  .big-list li .li-icon{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;color:var(--gold-dark);
  }

  /* ---------- Roadmap ---------- */
  .roadmap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media (max-width:700px){.roadmap-grid{grid-template-columns:1fr;}}
  .roadmap-card{
    border:1px dashed var(--gold-dark);border-radius:12px;
    padding:16px 18px;background:var(--benefit-bg);
    display:flex;gap:14px;align-items:flex-start;
  }
  .roadmap-card .rc-icon{
    width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .roadmap-card .rc-icon .icon{width:55%;height:55%;}
  .roadmap-card h3{font-size:calc(var(--body-size) + 2px);color:var(--navy);font-weight:800;margin-bottom:4px;}
  .roadmap-card p{font-size:var(--small-size);color:var(--ink);line-height:1.4;}
  .roadmap-badge{
    display:inline-block;margin-top:6px;font-size:11px;font-weight:800;
    color:var(--gold-dark);background:#fff;border:1px solid var(--gold-dark);
    border-radius:999px;padding:2px 10px;
  }

  /* ---------- Summary ---------- */
  .summary-list{list-style:none;padding:0;display:grid;gap:14px;margin-top:8px;}
  .summary-list li{
    display:flex;align-items:center;gap:14px;
    font-size:calc(var(--body-size) + 1px);font-weight:700;color:var(--navy);
    background:var(--bg);border-radius:12px;padding:14px 18px;
  }
  .summary-list .num{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:var(--gold);color:var(--navy);font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .thanks{margin-top:auto;text-align:center;font-size:var(--tagline-size);font-weight:800;color:var(--navy-3);}

  /* ---------- UI controls ---------- */
  .ui-controls{
    position:fixed;left:0;right:0;top:0;z-index:50;
  }
  .progress-bar{height:4px;background:var(--border);width:100%;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));width:0%;transition:width .25s ease;}
  .toc-btn{
    position:fixed;top:14px;right:16px;z-index:60;
    background:var(--navy);color:#fff;border:none;border-radius:999px;
    padding:8px 16px;font-size:var(--small-size);font-weight:700;
    display:flex;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;
  }
  .toc-btn .icon{width:16px;height:16px;}
  .nav-controls{
    position:fixed;bottom:14px;left:0;right:0;z-index:60;
    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .nav-btn{
    background:#fff;border:1px solid var(--border);border-radius:999px;
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 8px rgba(10,38,71,.12);
  }
  .nav-btn .icon{width:20px;height:20px;color:var(--navy);}
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .slide-counter{
    background:#fff;border:1px solid var(--border);border-radius:999px;
    padding:8px 16px;font-size:var(--small-size);font-weight:700;color:var(--navy);
    box-shadow:0 2px 8px rgba(10,38,71,.12);
  }

  /* ---------- Print ---------- */
  @media print{
    :root{
      --title-size:32px;--h2-size:26px;--tagline-size:17px;--body-size:15px;--small-size:11px;--eyebrow-size:11px;
    }
    @page{size:landscape;margin:0;}
    html,body{height:auto;overflow:visible;background:#fff;}
    .ui-controls,.toc-btn,.nav-controls{display:none !important;}
    #slides{position:static;width:auto;height:auto;}
    .slide{
      display:flex !important;
      position:static !important;
      width:100vw;height:100vh;
      page-break-after:always;
      break-after:page;
    }
    .slide-inner{overflow:visible;}
  }
</style>
</head>

  function renderToc(){
    var order = ['A','B','C','D','E'];
    var cards = order.map(function(g){
      var items = DATA.filter(function(s){ return s.type==='module' && s.group===g && !s.tocSkip; });
      var unitLabel = (g==='D') ? 'ລາຍງານ' : 'ໂມດູນ';
      return ''+
      '<div class="toc-card">'+
        '<div class="toc-card-head">'+
          '<div class="toc-letter">'+g+'</div>'+
          '<div><div class="toc-name">'+GROUP_LABELS[g]+'</div><div class="toc-count">'+items.length+' '+unitLabel+'</div></div>'+
        '</div>'+
        '<ul class="toc-list">'+
          items.map(function(it){ return '<li><a data-jump="'+it.id+'">'+(it.tocTitle||it.title)+'</a></li>'; }).join('')+
        '</ul>'+
      '</div>';
    }).join('');

    return ''+
    '<div class="slide" id="toc">'+
      '<div class="slide-inner">'+
        '<div class="eyebrow">'+ICON('menu')+' ສາລະບານ</div>'+
        '<h2 class="module-title" style="font-size:var(--h2-size)">5 ກຸ່ມເມນູ ໃນລະບົບ Web Admin</h2>'+
        '<div class="toc-grid">'+cards+'</div>'+
      '</div>'+
    '</div>';
  }

  /* ================= BUILD ================= */
  var html = '';
  DATA.forEach(function(s){
    if(s.type==='cover') html += renderCover();
    else if(s.type==='overview') html += renderOverview();
    else if(s.type==='toc') html += renderToc();
    else if(s.type==='module') html += renderModule(s);
    else if(s.type==='list') html += renderList(s);
    else if(s.type==='roadmap') html += renderRoadmap();
    else if(s.type==='summary') html += renderSummary();
  });
  document.getElementById('slides').innerHTML = html;

  // footer (page number) on every slide
  var allSlides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var total = allSlides.length;
  allSlides.forEach(function(el,i){
    var footer = document.createElement('div');
    footer.className = 'slide-footer';
    footer.innerHTML = '<span><b>SSMI HRM</b> — Web Admin</span><span>ໜ້າ '+(i+1)+' / '+total+'</span>';
    el.appendChild(footer);
  });

  /* ================= NAVIGATION ================= */
  var current = 0;
  var progressFill = document.getElementById('progressFill');
  var counterEl = document.getElementById('slideCounter');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');

  function goTo(idx){
    if(idx < 0) idx = 0;
    if(idx > total-1) idx = total-1;
    allSlides[current].classList.remove('active');
    current = idx;
    allSlides[current].classList.add('active');
    var inner = allSlides[current].querySelector('.slide-inner');
    if(inner) inner.scrollTop = 0;
    progressFill.style.width = ((current+1)/total*100)+'%';
    counterEl.textContent = (current+1)+' / '+total;
    btnPrev.disabled = current === 0;
    btnNext.disabled = current === total-1;
  }

  function next(){ goTo(current+1); }
  function prev(){ goTo(current-1); }

  btnNext.addEventListener('click', next);
  btnPrev.addEventListener('click', prev);
  document.getElementById('btnTocJump').addEventListener('click', function(){
    var idx = allSlides.findIndex(function(el){ return el.id==='toc'; });
    goTo(idx);
  });

  document.addEventListener('click', function(e){
    var jump = e.target.closest && e.target.closest('[data-jump]');
    if(jump){
      var id = jump.getAttribute('data-jump');
      var idx = allSlides.findIndex(function(el){ return el.id===id; });
      if(idx > -1) goTo(idx);
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); goTo(0); }
    else if(e.key==='End'){ e.preventDefault(); goTo(total-1); }
  });

  // touch swipe
  var touchStartX = null;
  document.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(touchStartX===null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(dx < -50) next();
    else if(dx > 50) prev();
    touchStartX = null;
  }, {passive:true});

  goTo(0);
})();
</script>
</body>
</html>
